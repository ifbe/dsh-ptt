<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ptt ws 模式测试</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, sans-serif;
    height: 100vh; /* 兼容旧浏览器 */
    height: 100dvh; /* 移动端动态视口：跟随地址栏收起/展开，底部不被遮挡 */
    display: flex;
    flex-direction: column;
  }
  /* 上：聊天区（占剩余空间，可滚动） */
  #chat { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 12px; background: #f0f2f5; }
  .bubble { max-width: 70%; padding: 8px 12px; border-radius: 12px; margin: 6px 0; word-wrap: break-word; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .b-think  { background: #e8e8e8; color: #777; font-style: italic; border-top-left-radius: 2px; }
  .b-reply  { background: #4fc3f7; color: #fff; border-top-left-radius: 2px; }
  .b-self   { background: #ffd54f; color: #333; margin-left: auto; border-top-right-radius: 2px; }
  .b-speak  { background: #ce93d8; color: #fff; border-top-left-radius: 2px; }
  .b-audio  { background: #fff; border: 1px solid #0288d1; border-radius: 8px; padding: 6px; }
  .b-audio audio { width: 100%; display: block; }
  .b-audio .lbl { font-size: 12px; color: #0288d1; margin-bottom: 4px; }
  .note { font-size: 12px; color: #999; margin: 3px 0; text-align: center; }

  /* 下：控件区（结尾在 100%，起点按内容自适应；内容多时内部滚动） */
  #ctrl { flex: 0 0 auto; max-height: 50%; overflow-y: auto; padding: 10px 12px; background: #fff; border-top: 1px solid #ccc; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row > * { flex: 1; }
  input, textarea, button { padding: 6px 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; }
  textarea { resize: none; }
  button { cursor: pointer; background: #f5f5f5; }
  button:hover { background: #e0e0e0; }
  #btnToggle { flex: none; padding: 6px 14px; }
  #status { font-size: 12px; color: #666; }
  .conn { color: #4caf50; }
  .disconn { color: #f44336; }
</style>
</head>
<body>
<div id="chat"></div>
<div id="ctrl">
  <div class="row">
    <input id="wsUrl">
    <button id="btnToggle">未连接，点我连接</button>
  </div>
  <div class="row" style="align-items: stretch;">
    <textarea id="chatInput" rows="3" placeholder="文本消息（回车=换行）&#10;/help /status /model /stop /reset /compact"></textarea>
    <div style="display:flex;flex-direction:column;gap:6px;flex:none;">
      <button onclick="sendText()">发送文字</button>
      <button onclick="sendCmd()">发送命令</button>
      <button onclick="clearChat()">清空</button>
    </div>
  </div>
  <div class="row">
    <input type="file" id="wavFile" accept=".wav,audio/wav">
  </div>

</div>

<script>
let ws = null;

const $ = (id) => document.getElementById(id);
const chat = $('chat');

// ws 地址默认 = 当前页面 URL（同 host:port）
$('wsUrl').value = 'ws://' + location.host;

function addBubble(cls, text) {
  const div = document.createElement('div');
  div.className = 'bubble ' + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}
function addAudioBubble(bytes) {
  const div = document.createElement('div');
  div.className = 'bubble b-audio';
  const lbl = document.createElement('div');
  lbl.className = 'lbl';
  lbl.textContent = '🔊 语音 ' + bytes.length + ' 字节';
  const audio = document.createElement('audio');
  audio.controls = true; // 播放/暂停/进度条
  audio.src = URL.createObjectURL(new Blob([bytes], { type: 'audio/wav' }));
  div.appendChild(lbl);
  div.appendChild(audio);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}
function addNote(text) {
  const div = document.createElement('div');
  div.className = 'note';
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function setToggle(label) {
  $('btnToggle').textContent = label;
}

function connect() {
  const url = $('wsUrl').value.trim() || ('ws://' + location.host);
  if (!url) return alert('填 ws 地址');
  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    addNote('已连接 ' + url);
    setToggle('已连接，点我断开');
  };
  ws.onclose = () => {
    addNote('连接断开');
    ws = null;
    setToggle('未连接，点我连接');
  };
  ws.onerror = () => { /* 连接失败：按钮不变 */ };
  ws.onmessage = (e) => {
    if (typeof e.data === 'string') {
      let msg;
      try { msg = JSON.parse(e.data); } catch { addNote('非 JSON 文本: ' + e.data.slice(0, 100)); return; }
      if (msg.type === 'text') {
        if (msg.kind === 'think') addBubble('b-think', '💭 ' + msg.text);
        else addBubble('b-reply', msg.text);
      } else if (msg.type === 'speak') {
        addBubble('b-speak', '🔊 ' + msg.text);
      } else {
        addNote('JSON: ' + JSON.stringify(msg).slice(0, 200));
      }
    } else {
      const buf = new Uint8Array(e.data);
      const head = String.fromCharCode(...buf.slice(0, 4));
      addNote('收到 binary ' + buf.length + ' 字节 头=' + head);
      if (head === 'RIFF') addAudioBubble(buf);
    }
  };
}

// 连接/断开合一：点一下切换
$('btnToggle').onclick = () => {
  if (ws && ws.readyState === WebSocket.OPEN) { ws.close(); }
  else { connect(); }
};

function sendText() {
  const text = $('chatInput').value.trim();
  if (!text) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) return alert('未连接');
  ws.send(text);
  addBubble('b-self', text);
  $('chatInput').value = '';
}
// 发送命令：自动加 /
function sendCmd() {
  const text = $('chatInput').value.trim();
  if (!text) return;
  sendCmdText(text.startsWith('/') ? text : '/' + text);
  $('chatInput').value = '';
}
function sendCmdText(cmd) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return alert('未连接');
  ws.send(cmd);
  addBubble('b-self', cmd);
}

$('wavFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) return alert('未连接');
  file.arrayBuffer().then((buf) => {
    ws.send(buf);
    addNote('已发送 wav ' + buf.byteLength + ' 字节（' + file.name + '）');
  });
  e.target.value = '';
});

function clearChat() { chat.innerHTML = ''; }
</script>
</body>
</html>
